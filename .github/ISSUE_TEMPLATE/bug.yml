name: 버그 제보
description: 프로젝트 코드·동작의 버그를 기록합니다.
title: "[bug] "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: 문제 설명
      description: 어떤 문제가 발생했는지 작성하세요.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 정상이라면 어떻게 동작해야 하는지 작성하세요.
  - type: textarea
    id: evidence
    attributes:
      label: 로그·스크린샷·추가 정보
      description: Secret이나 Token이 노출되지 않았는지 확인하세요.
  - type: input
    id: due
    attributes:
      label: 목표 완료일
      placeholder: YYYY-MM-DD
